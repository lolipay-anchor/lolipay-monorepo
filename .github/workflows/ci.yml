name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: the wasm the deploy would use must build
        run: |
          rustup target add wasm32v1-none
          cargo build --release --target wasm32v1-none --locked

  coordinator:
    name: coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lolipay
          POSTGRES_PASSWORD: lolipay
          POSTGRES_DB: lolipay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lolipay"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lolipay:lolipay@localhost:5432/lolipay?schema=public
    defaults:
      run:
        working-directory: services/coordinator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/coordinator/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: types, specs included
        run: npx tsc --noEmit
      - run: npm test
      - name: the migrations must reproduce the schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema.prisma \
            --exit-code
      - name: the object store the end-to-end suite writes payment proof to
        run: |
          timeout 300 docker compose -f docker-compose.e2e.yml -p lolipay-e2e up -d minio
          timeout 60 bash -c 'until curl -sf http://localhost:19000/minio/health/live >/dev/null; do sleep 1; done'
      - name: end to end, against a real database and a real object store
        run: npm run test:e2e
      - name: production dependencies carry no known high severity advisory
        if: '!cancelled()'
        run: npm audit --audit-level=high --omit=dev

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: unit tests, one app at a time so a flake can be named
        run: pnpm run test -- --reporter=verbose --no-file-parallelism

  frontend-lint:
    name: frontend lint (a ceiling, not a target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint findings must not increase
        run: pnpm run lint:ratchet

  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no AI working document may be tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '^(CLAUDE\.md|AGENTS\.md|docs/|\.claude/|\.codegraph/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::these are local-only and must never be committed:"
            echo "$bad"
            exit 1
          fi
          echo "clean — no AI documents tracked"

      - name: the working tree must carry no untracked leftovers
        run: |
          set -euo pipefail
          left=$(git status --porcelain -uall | grep '^??' || true)
          if [ -n "$left" ]; then
            echo "::error::untracked files present in a clean checkout:"
            echo "$left"
            exit 1
          fi

      - name: no secret anywhere in history
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLf -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          cat > "$RUNNER_TEMP/.gitleaksignore" <<'IGNORE'
          f30af5f08cf0ea3092f1cd393138ce0e15feb4a8:services/coordinator/src/anchor/anchor-identity.spec.ts:generic-api-key:5
          f30af5f08cf0ea3092f1cd393138ce0e15feb4a8:services/coordinator/src/anchor/anchor-identity.spec.ts:generic-api-key:11
          af49dd9dc3ad460ed2c2d7a9bb66386439a2a977:.env.example:generic-api-key:20
          IGNORE
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact -v -i "$RUNNER_TEMP"

      - name: the secret shapes this project's own scanner knows, across every commit
        run: |
          set -euo pipefail
          git log -p --no-color | python3 .githooks/secret_scan.py
