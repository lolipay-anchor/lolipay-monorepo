[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
soroban-sdk = "26"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
