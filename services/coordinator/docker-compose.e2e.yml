services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lolipay
      POSTGRES_PASSWORD: lolipay
      POSTGRES_DB: lolipay
    ports: ["127.0.0.1:5432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: e2eminioadmin
      MINIO_ROOT_PASSWORD: e2eminiopassword123
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: ["/data"]
