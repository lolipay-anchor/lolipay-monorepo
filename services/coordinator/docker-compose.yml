services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lolipay
      POSTGRES_PASSWORD: lolipay
      POSTGRES_DB: lolipay
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lolipay
      MINIO_ROOT_PASSWORD: lolipaydev
    volumes: ["minio-data:/data"]
    restart: unless-stopped
  coordinator:
    build: .
    env_file: [.env]
    environment:
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: lolipay
      MINIO_SECRET_KEY: lolipaydev
      MINIO_BUCKET: lolipay-uploads
    depends_on: [postgres, minio]
    ports: ["127.0.0.1:3000:3000"]
volumes: { pgdata: {}, minio-data: {} }
